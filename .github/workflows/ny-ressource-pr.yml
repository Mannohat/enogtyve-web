name: Ny ressource → PR

on:
  issues:
    types: [opened, reopened]

jobs:
  opret-pr:
    # Kør kun hvis issue har label "ny-ressource"
    if: contains(github.event.issue.labels.*.name, 'ny-ressource')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Indsæt ressource i bookmarks.astro
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/insert-resource.mjs

      - name: Opret PR med ændringen
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ressource/issue-${{ github.event.issue.number }}
          commit-message: "feat: tilføj ressource fra issue #${{ github.event.issue.number }}"
          title: "Ny ressource: ${{ github.event.issue.title }}"
          body: |
            Denne PR er automatisk oprettet fra issue #${{ github.event.issue.number }}.

            **Foreslået af:** @${{ github.event.issue.user.login }}

            **Issue:** ${{ github.event.issue.html_url }}

            ---
            Gennemse kortet i `src/pages/da/faellesskab/bookmarks.astro` inden du merger.
          labels: |
            ny-ressource
            automatisk-pr

      - name: Kommenter på issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Tak for forslaget! En PR er automatisk blevet oprettet til gennemgang. Vi kigger på den hurtigst muligt.'
            })
