name: Dagligt Netlify-rebuild

# Sitet er statisk: "næste konference" på forsiden, "Afholdt"-badges og
# Event-skemaet regnes kun ud ved build. Et build hook lige efter midnat UTC
# holder dem ajour uden manuelle pushes.
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Udløs Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::Secret NETLIFY_BUILD_HOOK er ikke sat"
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
